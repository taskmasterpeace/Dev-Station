<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="url(#grad)"/>
  <!-- Dashboard grid pattern -->
  <rect x="6" y="6" width="8" height="8" rx="1.5" fill="white" opacity="0.95"/>
  <rect x="18" y="6" width="8" height="8" rx="1.5" fill="white" opacity="0.7"/>
  <rect x="6" y="18" width="8" height="8" rx="1.5" fill="white" opacity="0.7"/>
  <rect x="18" y="18" width="8" height="8" rx="1.5" fill="white" opacity="0.5"/>
  <!-- Play triangle in top-left to indicate "running" -->
  <polygon points="8,8 8,12 11,10" fill="#22c55e"/>
</svg>
